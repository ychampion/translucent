[project]
name = "translucent"
version = "0.1.0"
description = "Closed-loop campaign runtime for materials R&D: observe, measure, test, earn claims."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openai>=2.0",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pydantic>=2.8",
    "typing-extensions>=4.14",
    "meta-sam-parser==0.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "modal>=1.6",
]

[project.scripts]
translucent = "translucent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6.0"]
# The computational executor for the pybamm-fastcharge system (uv sync --group solver). Pinned exactly: results are
# hashed and bit-identical replay holds only within these versions. Never imported by the API or MCP processes.
solver = ["pybamm==26.10.1.1", "casadi==3.8.1", "pybammsolvers==0.11.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "modal: runs against real Modal (opt-in, TRANSLUCENT_MODAL_TESTS=1)",
    "solver: runs the PyBaMM solver (opt-in, uv sync --group solver and TRANSLUCENT_SOLVER_TESTS=1)",
]
