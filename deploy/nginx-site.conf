# Optional public front door on a host that already runs nginx. Not enabled by default.
# Replace demo.example.org, add TLS (certbot --nginx -d demo.example.org), then:
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/translucent
#   sudo ln -s /etc/nginx/sites-available/translucent /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name demo.example.org;
    client_max_body_size 500m;  # recordings people upload
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # campaign updates stream
        proxy_read_timeout 1h;
    }
}
