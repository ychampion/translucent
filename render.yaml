# Render Blueprint: the public, read-only demo. It is the static web export with its recorded campaigns and examples,
# built under the path /demo so another site's host can forward <its domain>/demo/* here unchanged.
# There is no API server and there are no model keys: on a public host the app never looks for a server
# (web/lib/sources.ts, apiConfigured), so visitors replay recordings and cannot start campaigns.
# The live API stays on a private host (deploy/).
services:
  - type: web
    runtime: static
    name: translucent
    buildCommand: >-
      command -v bun >/dev/null 2>&1 || curl -fsSL https://bun.sh/install | bash;
      export PATH="$HOME/.bun/bin:$PATH";
      cd web && bun install --frozen-lockfile && NEXT_PUBLIC_BASE_PATH=/demo bun run build &&
      rm -rf ../render-site && mkdir -p ../render-site && mv out ../render-site/demo
    staticPublishPath: ./render-site
    pullRequestPreviewsEnabled: false
    routes:
      - type: redirect
        source: /
        destination: /demo/
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
